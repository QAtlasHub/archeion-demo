name: validate

# Thin wrapper: the same two commands run locally. No logic lives here.
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - run: julia --startup-file=no tools/validate.jl .
      - run: julia --startup-file=no tools/selftest.jl
      - run: julia --startup-file=no tools/build.jl .
