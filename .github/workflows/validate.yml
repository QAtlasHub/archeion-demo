name: validate

# Thin wrapper: the same command runs locally. The registry's tools are Archeion.jl, pinned here;
# the version below is the one named in registry.toml.
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - name: Install Archeion into a throwaway environment
        run: julia --startup-file=no -e 'using Pkg; Pkg.activate("archeion-env"); Pkg.add(url="https://github.com/QAtlasHub/Archeion.jl", rev="v0.4.0")'
      - run: julia --startup-file=no --project=archeion-env -m Archeion validate .
      - run: julia --startup-file=no --project=archeion-env -m Archeion build .
